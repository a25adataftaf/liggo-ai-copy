name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      pages: ${{ steps.pages.outcome }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar
        run: npm run build
        env:
          # La web vive en https://usuario.github.io/liggo-ai-copy/
          VITE_BASE_PATH: /${{ github.event.repository.name }}/

      - name: Fallback SPA (404 = index)
        run: cp dist/index.html dist/404.html

      # Si Pages todavía no está activado en el repo, no rompemos el CI:
      # solo avisamos de cómo activarlo (Settings → Pages → Source: GitHub Actions).
      - id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true

      - name: Aviso si Pages no está activado
        if: steps.pages.outcome != 'success'
        run: |
          echo "::warning::GitHub Pages no está activado en este repositorio. Ve a Settings → Pages → Build and deployment → Source: GitHub Actions y vuelve a ejecutar este workflow."
          {
            echo "### ⚠️ Falta activar GitHub Pages"
            echo ""
            echo "El build se ha generado bien, pero la web todavía no se puede publicar."
            echo ""
            echo "1. Abre **Settings → Pages**."
            echo "2. En *Build and deployment*, elige **Source: GitHub Actions**."
            echo "3. Vuelve a lanzar este workflow (Actions → Deploy a GitHub Pages → Run workflow)."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outcome == 'success'
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    if: needs.build.outputs.pages == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
